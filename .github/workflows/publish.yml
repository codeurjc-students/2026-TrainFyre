name: Publish Docker artifacts

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        required: true
        default: main
        type: string
      commit:
        description: Optional commit SHA (takes precedence over ref)
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/trainfyre
  COMPOSE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/trainfyre-compose

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.commit || inputs.ref) || '' }}
          fetch-depth: 0

      - name: Calculate publication tags
        id: metadata
        shell: bash
        env:
          DISPATCH_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short=7 HEAD)"

          case "${GITHUB_EVENT_NAME}" in
            push)
              image_tag="dev"
              compose_tag="dev"
              ;;
            release)
              compose_tag="${GITHUB_REF_NAME#v}"
              if [[ "$compose_tag" =~ ^[0-9]+\.[0-9]+$ ]]; then
                image_tag="${compose_tag}.0"
              else
                image_tag="$compose_tag"
              fi
              ;;
            workflow_dispatch)
              branch="$DISPATCH_REF"
              branch="${branch//\//-}"
              branch="${branch//[^a-zA-Z0-9._-]/-}"
              image_tag="${branch}-$(date -u +%Y%m%d%H%M%S)-${commit}"
              compose_tag="$image_tag"
              ;;
          esac

          {
            echo "image_tag=$image_tag"
            echo "compose_tag=$compose_tag"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release versions
        if: github.event_name == 'release'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.metadata.outputs.image_tag }}
        run: |
          set -euo pipefail

          expected="$EXPECTED_VERSION"

          if [[ ! "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$expected' is not a semantic version. Use a tag such as 0.1.0, not 'dev'."
            exit 1
          fi

          pom_version="$(sed -n 's:.*\<version>\([^<]*\)</version>.*:\1:p' backend/TrainFyre/pom.xml | sed -n '2p' | sed 's/-SNAPSHOT$//')"
          package_version="$(node -p "require('./frontend/package.json').version")"

          echo "Expected release version: $expected"
          echo "pom.xml version: $pom_version"
          echo "frontend/package.json version: $package_version"

          if [[ "$pom_version" != "$expected" || "$package_version" != "$expected" ]]; then
            echo "::error::Release tag and project versions must match. Update both files to $expected before publishing."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.metadata.outputs.image_tag }}
            ${{ github.event_name == 'release' && format('{0}:latest', env.IMAGE_REPOSITORY) || '' }}
          build-args: |
            AOT_PROFILES=prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install ORAS
        uses: oras-project/setup-oras@v2

      - name: Publish stable Compose OCI artifact
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
        run: |
          set -euo pipefail

          compose_file="docker-compose-release.yml"
          trap 'rm -f "$compose_file"' EXIT

          sed -E "s|\\\$\{IMAGE_TAG:-[^}]*\}|${RELEASE_IMAGE_TAG}|g" \
            docker/docker-compose.yml > "$compose_file"

          oras push "docker.io/${COMPOSE_REPOSITORY}:${{ steps.metadata.outputs.compose_tag }}" \
            "$compose_file:application/vnd.docker.compose.v1+yaml"

          oras push "docker.io/${COMPOSE_REPOSITORY}:latest" \
            "$compose_file:application/vnd.docker.compose.v1+yaml"

      - name: Publish development Compose OCI artifact
        if: github.event_name != 'release'
        shell: bash
        run: |
          set -euo pipefail

          oras push "docker.io/${COMPOSE_REPOSITORY}:${{ steps.metadata.outputs.compose_tag }}" \
            docker/docker-compose-dev.yml:application/vnd.docker.compose.v1+yaml
