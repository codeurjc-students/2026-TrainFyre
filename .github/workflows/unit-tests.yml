name: Unit tests

# Control de calidad básico (backend + frontend).
# Se ejecuta en cada push a cualquier rama EXCEPTO main.
# En main (merge de un PR) se ejecuta el workflow "Full test suite".
on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

# Si se hace un nuevo push a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/TrainFyre

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          cache-dependency-path: backend/TrainFyre/pom.xml

      # Se excluyen los tests que arrancan contexto de Spring o usan Docker:
      #   *IntegrationTest            -> @SpringBootTest / @DataJpaTest
      #   *E2ETest                    -> @SpringBootTest + Testcontainers (Postgres / MariaDB)
      #   TrainFyreApplicationTests   -> carga completa del contexto
      # Quedan: dominio, comandos/queries, servicios (Mockito), controlador (Mockito)
      # y ArchitectureTest (Spring Modulith).
      - name: Run unit tests
        run: >
          mvn -B -ntp test
          -Dtest='!*IntegrationTest,!*E2ETest,!TrainFyreApplicationTests'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-reports
          path: backend/TrainFyre/target/surefire-reports/
          retention-days: 7

  frontend-unit-tests:
    name: Frontend build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit
