sonar.projectKey=trainfyre-frontend
sonar.sources=src
sonar.tests=tests,e2e
sonar.test.inclusions=tests/**/*.ts,tests/**/*.tsx,e2e/**/*.ts
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,test-results/**,playwright-report/**
sonar.coverage.exclusions=src/main.tsx,e2e/**,tests/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
