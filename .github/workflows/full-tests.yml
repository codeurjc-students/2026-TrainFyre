name: Full test suite + SonarQube Cloud

# Se ejecuta al abrir/actualizar un PR hacia main y cuando se hace merge a main.
# Ejecuta TODOS los tests (unitarios, integración y E2E), genera la cobertura
# con JaCoCo y envía el análisis a SonarQube Cloud en la misma ejecución.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read   # necesario para que Sonar analice/decore el PR

concurrency:
  group: full-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend/TrainFyre

jobs:
  full-tests:
    name: Unit + Integration + E2E + Sonar
    runs-on: ubuntu-latest
    # No se lanza en PRs en borrador (sí en el push a main).
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Sonar necesita el historial completo para atribuir "new code"

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          cache-dependency-path: backend/TrainFyre/pom.xml

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Docker viene instalado en ubuntu-latest, así que Testcontainers
      # (postgres:16-alpine y MariaDB) funciona sin configuración extra.
      # "verify" ejecuta todos los tests, empaqueta y genera el informe JaCoCo;
      # después, en la misma invocación, el scanner de Maven envía a Sonar.
      - name: Build, test and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # decoración del PR
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -ntp verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=codeurjc-students
          -Dsonar.projectKey=codeurjc-students_2026-TrainFyre

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-reports
          path: |
            backend/TrainFyre/target/surefire-reports/
            backend/TrainFyre/target/site/jacoco/
          retention-days: 7