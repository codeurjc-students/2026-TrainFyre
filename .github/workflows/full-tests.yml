name: Full test suite + SonarQube Cloud

# Control de calidad completo (backend + frontend).
# Se ejecuta al abrir/actualizar un PR hacia main y cuando se hace merge a main.
# Backend y frontend se prueban en paralelo; el job "sonar" espera a ambos y envía
# a SonarQube Cloud UN ÚNICO análisis con la cobertura de los dos.
# Para impedir el merge si algo falla, marca los jobs como "Required status check"
# en Settings > Branches > Branch protection rules (main).
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read   # necesario para que Sonar analice/decore el PR

concurrency:
  group: full-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit + integration + E2E
    runs-on: ubuntu-latest
    # No se lanza en PRs en borrador (sí en el push a main).
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/TrainFyre

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          cache-dependency-path: backend/TrainFyre/pom.xml

      # Docker viene instalado en ubuntu-latest, así que Testcontainers
      # (postgres:16-alpine y MariaDB) funciona sin configuración extra.
      # "verify" ejecuta todos los tests, empaqueta y genera el informe JaCoCo.
      # El análisis de Sonar se hace después, en el job "sonar".
      - name: Build and test
        run: mvn -B -ntp verify

      # Lo que Sonar necesita del backend: clases compiladas e informe XML de JaCoCo
      - name: Upload Sonar inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-sonar-inputs
          path: |
            backend/TrainFyre/target/classes
            backend/TrainFyre/target/site/jacoco/jacoco.xml
          if-no-files-found: error
          retention-days: 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/TrainFyre/target/surefire-reports/
            backend/TrainFyre/target/site/jacoco/
          retention-days: 7

  frontend:
    name: Frontend unit + integration + E2E
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      # docker-compose.yaml del backend exige esta variable
      DB_PASSWORD: ci-only-password

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Pruebas unitarias + cobertura (falla si baja de los umbrales de vitest.config.ts)
      - name: Unit tests with coverage
        run: npm run test:coverage

      # La cobertura se sube ya, para que Sonar la tenga aunque fallen los pasos siguientes
      - name: Upload coverage for Sonar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 1

      # Backend + PostgreSQL con los datos de ejemplo (perfil "dev"), necesarios para
      # las pruebas de integración y de sistema.
      - name: Start backend and database
        working-directory: backend/TrainFyre
        run: docker compose up -d --build

      - name: Wait for the REST API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:8080/incidence?page=0&size=1" > /dev/null; then
              echo "API ready"; exit 0
            fi
            echo "Waiting for the API ($i/60)..."; sleep 3
          done
          echo "The API did not start in time"; exit 1

      - name: Client-server integration tests
        run: npm run test:integration

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: System (E2E) tests
        run: npm run test:e2e

      - name: Show backend logs
        if: failure()
        working-directory: backend/TrainFyre
        run: docker compose logs --no-color

      - name: Stop backend and database
        if: always()
        working-directory: backend/TrainFyre
        run: docker compose down -v

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: |
            frontend/coverage/
            frontend/playwright-report/
          retention-days: 7

  sonar:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Sonar necesita el historial completo para atribuir "new code"

      - name: Download backend classes and JaCoCo report
        uses: actions/download-artifact@v5
        with:
          name: backend-sonar-inputs
          path: backend/TrainFyre/target

      - name: Download frontend coverage
        uses: actions/download-artifact@v5
        with:
          name: frontend-coverage
          path: frontend/coverage

      # Vitest escribe las rutas del lcov relativas a frontend/ (SF:src/App.tsx), pero
      # Sonar las resuelve desde la raíz del repo: se les añade el prefijo "frontend/".
      - name: Make lcov paths relative to the repository root
        run: sed -i 's#^SF:#SF:frontend/#' frontend/coverage/lcov.info

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # La configuración (clave de proyecto, fuentes, informes...) está en sonar-project.properties
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # decoración del PR
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
