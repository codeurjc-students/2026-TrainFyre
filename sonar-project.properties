# Configuración del análisis único (backend + frontend) en SonarQube Cloud.
# Se usa desde .github/workflows/full-tests.yml (sonarqube-scan-action).
sonar.host.url=https://sonarcloud.io
sonar.organization=codeurjc-students
sonar.projectKey=codeurjc-students_2026-TrainFyre

# Código de producción
sonar.sources=backend/TrainFyre/src/main,frontend/src,frontend/components/layout

# Código de tests (no cuenta como código ni en la cobertura)
sonar.tests=backend/TrainFyre/src/test,frontend/tests,frontend/e2e

# Backend (Java): clases compiladas y cobertura de JaCoCo
sonar.java.binaries=backend/TrainFyre/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend/TrainFyre/target/site/jacoco/jacoco.xml

# Frontend (TypeScript): cobertura de Vitest (lcov)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Fuera del análisis: dependencias, componentes generados por shadcn y datos de ejemplo
sonar.exclusions=**/node_modules/**,frontend/components/ui/**,backend/TrainFyre/src/main/resources/seed/**
sonar.coverage.exclusions=\
  backend/TrainFyre/src/main/java/es/codeurjc/students/trainfyre/TrainFyreApplication.java,\
  **/package-info.java,\
  frontend/src/types/**,\
  frontend/src/assets/**,\
  frontend/*.config.ts