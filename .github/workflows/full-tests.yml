name: Full test suite

# Se ejecuta al abrir/actualizar un PR hacia main y cuando se hace merge a main.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: full-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend/TrainFyre

jobs:
  full-tests:
    name: Unit + Integration + E2E
    runs-on: ubuntu-latest
    # No se lanza en PRs en borrador (sí en el push a main).
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          cache-dependency-path: backend/TrainFyre/pom.xml

      # Docker ya viene instalado en ubuntu-latest, por lo que Testcontainers
      # (postgres:16-alpine y MariaDB) funciona sin configuración extra.
      # "verify" ejecuta todos los tests (unitarios, integración y E2E)
      # y además comprueba que la aplicación empaqueta correctamente.
      - name: Run all tests
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-reports
          path: backend/TrainFyre/target/surefire-reports/
          retention-days: 7
