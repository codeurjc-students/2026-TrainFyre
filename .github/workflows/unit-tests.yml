name: Unit tests

# Basic quality control (backend + frontend).
# It runs on every push to any branch EXCEPT main.
# On main (merge of a pull request) the "Full test suite" workflow runs.
on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

# A new push to the same branch cancels the previous run.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/TrainFyre

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 27
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
          cache-dependency-path: backend/TrainFyre/pom.xml

      # The tests that start a Spring context or use Docker are excluded:
      #   *IntegrationTest            -> @SpringBootTest / @DataJpaTest / @WebMvcTest
      #   *E2ETest                    -> @SpringBootTest + Testcontainers (Postgres / MariaDB)
      #   TrainFyreApplicationTests   -> full context load
      # What remains: domain, commands/queries, services (Mockito), controllers (MockMvc standalone)
      # and ArchitectureTest (Spring Modulith).
      - name: Run unit tests
        run: >
          mvn -B -ntp test
          -Dtest='!*IntegrationTest,!*E2ETest,!TrainFyreApplicationTests'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-reports
          path: backend/TrainFyre/target/surefire-reports/
          retention-days: 7

  frontend-unit-tests:
    name: Frontend build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit
