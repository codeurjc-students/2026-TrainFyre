services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: trainfyre
      POSTGRES_USER: trainfyre
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    volumes:
      - trainfyre-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U trainfyre -d trainfyre"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  garage:
    image: dxflrs/garage:v2.5.0

    command:
      - /garage
      - server
      - --single-node
      - --default-bucket

    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?Define GARAGE_DEFAULT_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?Define GARAGE_DEFAULT_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:?Define GARAGE_DEFAULT_BUCKET}

    ports:
      - "127.0.0.1:3900:3900"

    volumes:
      - ./infrastructure/garage/garage.toml:/etc/garage.toml:ro
      - garage_metadata:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${DOCKERHUB_USERNAME:-local}/trainfyre:dev
    ports:
      - "127.0.0.1:443:443"

    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/trainfyre
      SPRING_DATASOURCE_USERNAME: trainfyre
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      SPRING_SQL_INIT_MODE: always

      TRAINFYRE_TLS_KEYSTORE: file:/run/trainfyre/trainfyre-local.p12
      TRAINFYRE_TLS_PASSWORD: ${TRAINFYRE_TLS_PASSWORD:?Define TRAINFYRE_TLS_PASSWORD}

      TRAINFYRE_JWT_PRIVATE_KEY: file:/run/trainfyre/jwt-private.pem
      TRAINFYRE_JWT_PUBLIC_KEY: file:/run/trainfyre/jwt-public.pem

      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: ${GARAGE_DEFAULT_BUCKET}
      S3_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      S3_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      S3_PATH_STYLE: "true"

    volumes:
      - type: bind
        source: ../backend/TrainFyre/secrets/trainfyre-local.p12
        target: /run/trainfyre/trainfyre-local.p12
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../backend/TrainFyre/secrets/jwt-private.pem
        target: /run/trainfyre/jwt-private.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../backend/TrainFyre/secrets/jwt-public.pem
        target: /run/trainfyre/jwt-public.pem
        read_only: true
        bind:
          create_host_path: false

    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_started

volumes:
  trainfyre-db-data:
  garage_metadata:
  garage_data:
