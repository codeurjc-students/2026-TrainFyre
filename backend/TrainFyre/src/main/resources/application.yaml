spring:
  application:
    name: TrainFyre

app:
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:eu-west-1}
      bucket: ${S3_BUCKET:user-avatars}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:false}

trainfyre:
  security:
    jwt:
      issuer: trainfyre
      audience: trainfyre-api
      access-token-ttl: 15m
      key-id: ${TRAINFYRE_JWT_KEY_ID:trainfyre-key-1}
      private-key: ${TRAINFYRE_JWT_PRIVATE_KEY}
      public-key: ${TRAINFYRE_JWT_PUBLIC_KEY}
    cors:
      allowed-origins: ${TRAINFYRE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
