name: Full test suite + SonarQube Cloud

# Complete quality control (backend + frontend).
# It runs when a pull request to main is opened or updated and when it is merged to main.
# Backend and frontend are tested in parallel; the "sonar" job waits for both and sends
# ONE single analysis with the coverage of both to SonarQube Cloud.
# To block the merge when something fails, mark the jobs as "Required status check"
# in Settings > Branches > Branch protection rules (main).
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: full-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit + integration + E2E
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/TrainFyre

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 27
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
          cache-dependency-path: backend/TrainFyre/pom.xml

      - name: Build and test
        run: mvn -B -ntp verify

      # Architecture documentation is generated by the tests (target/spring-modulith-docs).
      # A rendering problem must not block the merge, so this step is allowed to fail.
      - name: Render architecture documentation
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends graphviz asciidoctor
          # The PlantUML in apt is too old for the C4 diagrams of Modulith; Maven verifies the checksums.
          mvn -B -ntp dependency:get -Dartifact=net.sourceforge.plantuml:plantuml:1.2025.4
          PLANTUML="java -jar $HOME/.m2/repository/net/sourceforge/plantuml/plantuml/1.2025.4/plantuml-1.2025.4.jar" \
            bash ../../.github/scripts/build-architecture-site.sh target/architecture-site target/spring-modulith-docs target/architecture-docs

      - name: Upload architecture documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-docs
          path: backend/TrainFyre/target/architecture-site
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Sonar inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-sonar-inputs
          path: |
            backend/TrainFyre/target/classes
            backend/TrainFyre/target/site/jacoco/jacoco.xml
          if-no-files-found: error
          retention-days: 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/TrainFyre/target/surefire-reports/
            backend/TrainFyre/target/site/jacoco/
          retention-days: 7

  frontend:
    name: Frontend unit + integration + E2E
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      DB_PASSWORD: ci-only-password
      TRAINFYRE_TLS_PASSWORD: ci-only-password
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef01234567
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: user-avatars
      GARAGE_RPC_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage for Sonar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 1

      - name: Generate ephemeral credentials for CI
        working-directory: backend/TrainFyre
        run: |
          set -euo pipefail
          mkdir -p secrets

          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout secrets/tls.key \
            -out secrets/tls.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -addext "basicConstraints=critical,CA:TRUE"

          openssl pkcs12 -export \
            -in secrets/tls.crt \
            -inkey secrets/tls.key \
            -out secrets/trainfyre-local.p12 \
            -name trainfyre-local \
            -passout pass:ci-only-password

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out secrets/jwt-private.pem
          openssl pkey -in secrets/jwt-private.pem -pubout \
            -out secrets/jwt-public.pem

          echo "NODE_EXTRA_CA_CERTS=$GITHUB_WORKSPACE/backend/TrainFyre/secrets/tls.crt" >> "$GITHUB_ENV"
          echo "VITE_API_BASE_URL=https://localhost:443/api/v1" >> "$GITHUB_ENV"
          rm secrets/tls.key
          
          sudo chown 10001:10001 \
            secrets/trainfyre-local.p12 \
            secrets/jwt-private.pem \
            secrets/jwt-public.pem
          sudo chmod 0400 \
            secrets/trainfyre-local.p12 \
            secrets/jwt-private.pem \
            secrets/jwt-public.pem

      - name: Start backend and database
        working-directory: backend/TrainFyre
        run: docker compose -f ../../docker/docker-compose-dev.yml up -d --build

      - name: Wait for the REST API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --cacert "$NODE_EXTRA_CA_CERTS" "https://localhost:443/api/v1/incidences?page=0&size=1" > /dev/null; then
              echo "API ready"; exit 0
            fi
            echo "Waiting for the API ($i/60)..."; sleep 3
          done
          echo "The API did not start in time"; exit 1

      - name: Client-server integration tests
        run: npm run test:integration

      - name: Install Playwright browser
        run: npx --no-install playwright@1.63.0 install --with-deps chromium

      - name: System (E2E) tests
        run: npm run test:e2e

      - name: Show backend logs
        if: failure()
        working-directory: backend/TrainFyre
        run: docker compose -f ../../docker/docker-compose-dev.yml logs --no-color

      - name: Stop backend and database
        if: always()
        working-directory: backend/TrainFyre
        run: docker compose -f ../../docker/docker-compose-dev.yml down -v

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: |
            frontend/coverage/
            frontend/playwright-report/
          retention-days: 7

  sonar:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read   # needed so that Sonar can analyse and decorate the pull request

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download backend classes and JaCoCo report
        uses: actions/download-artifact@v5
        with:
          name: backend-sonar-inputs
          path: backend/TrainFyre/target

      - name: Download frontend coverage
        uses: actions/download-artifact@v5
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Make lcov paths relative to the repository root
        run: sed -i 's#^SF:#SF:frontend/#' frontend/coverage/lcov.info

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Publishes the architecture documentation generated from the code to GitHub Pages.
  # Only on merge to main, so the published site always matches main.
  pages:
    name: Publish architecture documentation
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'push'
    timeout-minutes: 10
    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # verify that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download architecture documentation
        uses: actions/download-artifact@v5
        with:
          name: architecture-docs
          path: site

      - name: Check that the site has an index
        run: |
          if [[ ! -f site/index.html ]]; then
            echo "::error::site/index.html is missing: the architecture rendering step failed in the backend job"
            ls -la site
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4